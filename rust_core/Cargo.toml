[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "ja_fast_scan"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Security"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
